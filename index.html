DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Necron AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  /* ============================= TOKENS ============================= */
  :root{
    --purple: #8b6bd6;
    --purple-soft: #6d5aa8;
    color-scheme: dark;
  }
  html[data-theme="dark"]{
    --bg: #0a0a0c;
    --bg-elevated: #131316;
    --bg-composer: #131316;
    --border: #232327;
    --text: #e9e8ec;
    --text-dim: #8b8a92;
    --text-faint: #57565e;
    --bubble-user: #1f1a2e;
    --bubble-user-border: #362a56;
    --bubble-ai: #131316;
    --bubble-ai-border: #232327;
    --watermark: rgba(139,107,214,0.055);
    --code-bg: #0d0d10;
    --danger: #d97373;
    --shadow: rgba(0,0,0,0.35);
  }
  html[data-theme="light"]{
    color-scheme: light;
    --bg: #faf9fb;
    --bg-elevated: #ffffff;
    --bg-composer: #ffffff;
    --border: #e7e5ea;
    --text: #201f24;
    --text-dim: #6f6d77;
    --text-faint: #b3b1ba;
    --bubble-user: #efe9fb;
    --bubble-user-border: #d9cdf2;
    --bubble-ai: #ffffff;
    --bubble-ai-border: #e7e5ea;
    --watermark: rgba(139,107,214,0.06);
    --code-bg: #f2f1f5;
    --danger: #b3453f;
    --shadow: rgba(20,15,35,0.08);
  }

  /* VIP-only royal gold theme: overrides the tokens above, scoped to
     #app.vip-user, so normal users keep the original black/white look on
     both light and dark, and only VIP accounts see the golden theme.
     Split by data-theme so VIP users still get working light/dark mode. */
  html[data-theme="dark"] #app.vip-user{
    --purple: #d4af37;
    --purple-soft: #a3801f;
    --bg: #0b0904;
    --bg-elevated: #15110a;
    --bg-composer: #15110a;
    --border: #2b2210;
    --text: #f3ead0;
    --text-dim: #b7a877;
    --text-faint: #6b5f3f;
    --bubble-user: #241d0c;
    --bubble-user-border: #4a3b14;
    --bubble-ai: #14110a;
    --bubble-ai-border: #2b2210;
    --watermark: rgba(212,175,55,0.06);
    --code-bg: #100d07;
    --shadow: rgba(0,0,0,0.5);
  }
  html[data-theme="light"] #app.vip-user{
    --purple: #b8860b;
    --purple-soft: #8a6a08;
    --bg: #fdf9ec;
    --bg-elevated: #fffdf5;
    --bg-composer: #fffdf5;
    --border: #ead9a3;
    --text: #2b2210;
    --text-dim: #7a6a30;
    --text-faint: #c7b672;
    --bubble-user: #faf0cd;
    --bubble-user-border: #e6cf7c;
    --bubble-ai: #ffffff;
    --bubble-ai-border: #ead9a3;
    --watermark: rgba(184,134,11,0.08);
    --code-bg: #f7f0da;
    --shadow: rgba(120,90,10,0.12);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", "Tahoma", sans-serif;
  }

  #app{
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  @media (min-width: 561px){
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-elevated);
    }
    #app{
      height: min(100dvh, 900px);
      border-inline: 1px solid var(--border);
      box-shadow: 0 30px 80px var(--shadow);
    }
  }

  /* ============================= HEADER ============================= */
  header{
    flex: 0 0 auto;
    height: 54px;
    padding: env(safe-area-inset-top) 14px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    z-index: 5;
  }
  .header-left{
    display: flex;
    align-items: center;
    gap: 60px;
  }
  .logo-wrap{
  width: 45px;
  height: 45px;
  border-radius: 50%;
  padding: 5px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.logo-wrap::before{
  content: "";
  position: absolute;
  inset: -75%;
  background: conic-gradient(
    from 0deg,
    #7c3aed,
    #4f46e5,
    #2563eb,
    #0891b2,
    #14b8a6,
    #06b6d4,
    #6366f1,
    #8b5cf6,
    #7c3aed
  );
  animation: logoGradientSpin 9s linear infinite;
  filter: blur(7px);
  z-index: 0;
}

/* VIP users get a brighter, more luxurious gold ring around the logo, and a
   subtle golden glow, to visually stand out from regular accounts. */
#app.vip-user .logo-wrap::before{
  background: conic-gradient(
    from 0deg,
    #7a5c00,
    #d4af37,
    #fff3c4,
    #ffd700,
    #fff3c4,
    #d4af37,
    #7a5c00
  );
}
#app.vip-user .logo-wrap{
  box-shadow: 0 0 12px rgba(255,215,0,0.35);
}

.logo-wrap::after{
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: var(--bg);
  z-index: 1;
}

.logo-wrap svg{
  width: 100%;
  height: 100%;
  display: block;
  color: var(--text);
  position: relative;
  z-index: 2;
}

@keyframes logoGradientSpin{
  from{ transform: rotate(0deg); }
  to{ transform: rotate(360deg); }
}
  .theme-btn, .admin-btn{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  
  .admin-btn{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text);
  opacity: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  margin-inline-start: 60px;
  font-size: 18px;
  line-height: 1;
  padding: 0;
}
  .theme-btn svg, .admin-btn svg{ width: 17px; height: 17px; }

  /* ============================= WATERMARK ============================= */
  /* Anchored to .chat-area (not the scrolling .chat-scroll), so it stays
     visually locked in place on screen and never scrolls away with the
     conversation content. */
  .watermark{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 9vw, 40px);
    letter-spacing: 0.5px;
    color: var(--watermark);
    user-select: none;
  }

  /* ============================= MAIN AREA ============================= */
  .main-area{
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ============================= CHAT ============================= */
  /* Wraps the scrollable chat log together with the fixed watermark and the
     "new message" jump button, both of which live outside the scrolling
     element so their position never scrolls with the messages. */
  .chat-area{
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .chat-scroll{
    position: relative;
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1;
  }
  .welcome{
    margin: auto 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.9;
    padding: 0 20px;
  }
  .welcome b{ color: var(--text); font-weight: 600; }

  .msg-row{ display: flex; width: 100%; }
  .msg-row.user{ justify-content: flex-end; }
  .msg-row.ai{ justify-content: flex-start; }

  .bubble{
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 15px;
    font-size: 14.5px;
    line-height: 1.65;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .msg-row.user .bubble{
    background: var(--bubble-user);
    border: 1px solid var(--bubble-user-border);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }
  .msg-row.ai .bubble{
    background: var(--bubble-ai);
    border: 1px solid var(--bubble-ai-border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .bubble p{ margin: 0 0 8px 0; }
  .bubble p:last-child{ margin-bottom: 0; }
  .bubble ul, .bubble ol{ margin: 6px 0; padding-inline-start: 20px; }
  .bubble li{ margin: 2px 0; }
  .bubble h1, .bubble h2, .bubble h3{ margin: 10px 0 6px 0; line-height: 1.3; }
  .bubble h1{ font-size: 18px; }
  .bubble h2{ font-size: 16.5px; }
  .bubble h3{ font-size: 15px; }
  .bubble blockquote{
    margin: 6px 0;
    padding: 4px 10px;
    border-inline-start: 3px solid var(--purple);
    color: var(--text-dim);
  }
  .bubble hr{ border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .bubble a{ color: var(--purple); }
  .bubble code:not(.hljs){
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .code-block{
    margin: 8px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #232327 !important;
    background: #0d0d10 !important;
  }
  .code-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: 11.5px;
    color: #8b8a92 !important;
    border-bottom: 1px solid #232327 !important;
  }
  .copy-btn{
    background: transparent;
    border: 1px solid #333338;
    color: #8b8a92;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .code-block pre{
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: transparent !important;
  }
  .code-block code{
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre;
    background: transparent !important;
  }

  .typing{
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }
  .typing span{
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-faint);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: 0.2s; }
  .typing span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity: .25; } 40%{ opacity: 1; } }

  /* Positioned relative to .chat-area, so it sits fixed just above the
     usage row (message counter) regardless of scroll position, instead of
     drifting up/down with the chat bubbles. */
  .jump-btn{
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 14px var(--shadow);
    z-index: 3;
    display: none;
  }
  .jump-btn.show{ display: block; }

  /* ============================= COMPOSER ============================= */
  .usage-row{
    flex: 0 0 auto;
    padding: 4px 14px 0 14px;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    background: var(--bg-composer);
  }

  .composer{
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    background: var(--bg-composer);
    border-top: 1px solid var(--border);
  }
  textarea#msgInput{
    flex: 1;
    resize: none;
    max-height: 110px;
    min-height: 44px;
    padding: 11px 16px;
    border-radius: 22px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.4;
    font-family: inherit;
    outline: none;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.18);
    transition: border-color .15s, box-shadow .15s;
  }
  textarea#msgInput:focus{
    border-color: var(--purple-soft);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.16), inset 0 1px 3px rgba(0,0,0,0.18);
  }
  textarea#msgInput::placeholder{ color: var(--text-faint); }
  textarea#msgInput:disabled{ opacity: 0.5; }

  #sendBtn{
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--purple), var(--purple-soft));
    color: #1c1608;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s, transform .1s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
  }
  #sendBtn svg{ width: 19px; height: 19px; }
  #sendBtn:active{ transform: scale(0.92); }
  #sendBtn:disabled{ opacity: 0.4; cursor: default; }

  /* ============================= LOCK PANEL ============================= */
  .lock-panel{
    flex: 0 0 auto;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
    background: var(--bg-composer);
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .lock-panel.show{ display: flex; }
  .lock-title{ font-size: 13px; color: var(--text); font-weight: 600; }
  .lock-sub{ font-size: 11.5px; color: var(--text-dim); }
  .lock-countdown{
    font-size: 15px;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
  }

  /* ============================= LOGIN / ADMIN OVERLAYS ============================= */
  .login-overlay{
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
  }
  .admin-overlay{
    position: absolute;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,0.55);
  }
  .admin-overlay.show{ display: flex; }

  .login-card, .admin-card{
    width: 100%;
    max-height: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 20px 50px var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .login-card{ max-width: 340px; }
  /* Admin panel is enlarged and reorganized for more comfortable editing:
     bigger card, sectioned layout, paired fields, bigger touch targets. */
  .admin-card{ max-width: 560px; max-height: 90vh; padding: 30px; }
  .login-card h2, .admin-card h2{ margin: 0 0 4px 0; font-size: 17px; }
  .login-card h2{
  text-align: center;
}
  .admin-card h2{ margin: 0; font-size: 20px; }
  .admin-card h3{ margin: 0 0 12px 0; font-size: 13.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .admin-card .field-input{ padding: 12px 14px; font-size: 15px; }
  .admin-card .primary-btn{ padding: 13px; font-size: 15px; border-radius: 12px; }
  .admin-card .form-error{ font-size: 13px; }

  .admin-section{
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .admin-section:last-child{ margin-bottom: 0; }
  .admin-form-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .admin-form-grid .field-input{ margin-bottom: 0; }
  @media (max-width: 420px){
    .admin-form-grid{ grid-template-columns: 1fr; }
  }

  .field-input{
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .field-input:focus{ border-color: var(--purple-soft); }

  .primary-btn{
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--purple);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 2px;
  }
  .secondary-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    font-size: 13px;
    padding: 8px 10px;
    cursor: pointer;
  }

  .login-your-id{
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin: 4px 0 14px 0;
  }
  .login-your-id b{ color: var(--text); font-variant-numeric: tabular-nums; }
  .form-error{
    font-size: 12px;
    color: var(--danger);
    min-height: 14px;
    margin: -2px 0 8px 0;
  }
  .login-register{
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 16px;
  }
  .login-register-fa{
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 4px;
    direction: rtl;
  }

  .admin-header-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .admin-close-btn{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: color .15s, border-color .15s;
  }
  .admin-close-btn:hover{ color: var(--text); border-color: var(--purple-soft); }
  .admin-body{ overflow-y: auto; }
  .users-list{
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .admin-empty{ font-size: 12.5px; color: var(--text-faint); padding: 8px 0; }
  .user-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    transition: background .15s;
  }
  .user-row:hover{ background: var(--bg-elevated); }
  .user-avatar{
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--purple), var(--purple-soft));
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  .user-row.vip .user-avatar{
    background: linear-gradient(135deg,#f4d777,#d4af37,#a3801f);
    color: #3a2a05;
  }
  .user-info{ font-size: 13px; color: var(--text); min-width: 0; flex: 1 1 auto; }
  .user-info span{
    display: block;
    color: var(--text-dim);
    font-size: 11.5px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .user-type-badge{
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.3px;
  }
  .user-type-badge.vip{
    color: #3a2a05;
    background: linear-gradient(135deg,#f4d777,#d4af37,#a3801f);
    border-color: transparent;
  }
  select.field-input{ cursor: pointer; }

/* ============================================================
   USERS / AUTH - backed by a server (Cloudflare Pages Function + KV),
   NOT localStorage. This is what makes accounts actually work from any
   device or Telegram client, not just the one where they were created.
   ============================================================ */
const AUTH_KEY = "necron_ai:auth";
const DEVICE_ID_KEY = "necron_ai:device_id";
const CHAT_KEY_PREFIX = "necron_ai:chat:";

// Relative paths - works automatically as long as the API functions are
// deployed on the SAME domain as this page (Cloudflare Pages Functions
// under /functions/api/... do this by default, no config needed).
async function apiFetch(path, options){
    const res = await fetch(path, options);
    let data = null;
    try{ data = await res.json(); }catch(e){ /* non-JSON response */ }
    if (!res.ok){
        const err = new Error((data && data.error) || "Request failed");
        err.status = res.status;
        throw err;
    }
    return data;
}

function loadAuth(){
    try{
        const raw = localStorage.getItem(AUTH_KEY);
        return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
}
function saveAuth(auth){
    try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){}
}
function clearAuth(){
    try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}

// Verifies username/password/numericId against the server's user database.
// Throws on failure (err.status === 401 for wrong credentials).
async function attemptLogin(username, password){
    const data = await apiFetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, numericId: STATE.identity })
    });
    // data.user = { numericId, username, name, type } - cached locally so
    // the UI (VIP badge, limits, etc.) can read it synchronously afterwards.
    saveAuth(data.user);
    return true;
}

let tg = null;
try{
    if (window.Telegram && window.Telegram.WebApp){
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    }
}catch(e){ /* Telegram unavailable, continue as normal web app */ }

/* ============================================================
   IDENTITY (numeric ID used for both chat storage and login)
   ============================================================ */
function getTelegramNumericId(){
    try{
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id){
            return String(tg.initDataUnsafe.user.id);
        }
    }catch(e){}
    return null;
}
function getDeviceNumericId(){
    // Fallback used only when there is no Telegram identity available
    // (e.g. testing in a plain desktop browser). Persisted per-browser.
    let id;
    try{ id = localStorage.getItem(DEVICE_ID_KEY); }catch(e){}
    if (!id){
        id = String(Math.floor(1000000000 + Math.random() * 9000000000));
        try{ localStorage.setItem(DEVICE_ID_KEY, id); }catch(e){}
    }
    return id;
}
function resolveNumericId(){
    return getTelegramNumericId() || getDeviceNumericId();
}

    const auth = loadAuth();
    return !!(auth && auth.numericId === STATE.identity);
}

/* ============================================================
   USER TYPE (normal / VIP) - determines message limits + logo styling
   ============================================================ */
function getCurrentUserRecord(){
    const auth = loadAuth();
    if (!auth || auth.numericId !== STATE.identity) return null;
    return auth; // { numericId, username, name, type } - set at login time
}
function getCurrentUserType(){
    const rec = getCurrentUserRecord();
    return (rec && rec.type === "vip") ? "vip" : "normal";
}
function currentLimitConfig(){
    return getCurrentUserType() === "vip"
        ? { limit: CONFIG.VIP_LIMIT, windowHours: CONFIG.VIP_WINDOW_HOURS }
        : { limit: CONFIG.DAILY_LIMIT, windowHours: CONFIG.LIMIT_WINDOW_HOURS };
}

    if (welcomeEl){
        welcomeEl.innerHTML = isVip
            ? "Welcome to <b>Necron AI</b>.<br>You are using the VIP version."
            : "Welcome to <b>Necron AI</b>.<br>Type your message to start the conversation.";
    }
}

// Kept in memory only (never persisted) for the duration this panel stays
// unlocked, so add/delete requests can be authenticated too.
let adminSessionPassword = null;

function openAdminPanel(){
    adminPasswordInput.value = "";
    adminGateError.textContent = "";
    adminGate.style.display = "block";
    adminContent.style.display = "none";
    adminOverlay.classList.add("show");
}
function closeAdminPanel(){
    adminOverlay.classList.remove("show");
}
async function unlockAdmin(){
    const pass = adminPasswordInput.value;
    adminGateError.textContent = "";
    adminGateBtn.disabled = true;
    try{
        const data = await apiFetch("/api/users", {
            headers: { "X-Admin-Password": pass }
        });
        adminSessionPassword = pass;
        adminGate.style.display = "none";
        adminContent.style.display = "block";
        renderUsersListFromData(data.users);
    }catch(err){
        adminGateError.textContent = (err.status === 401)
            ? "Incorrect password."
            : "Could not reach the server. Please try again.";
    }finally{
        adminGateBtn.disabled = false;
    }
}
function renderUsersListFromData(users){
    usersList.innerHTML = "";
    if (!users.length){
        usersList.innerHTML = '<div class="admin-empty">No users yet.</div>';
        return;
    }
    users.forEach(u=>{
        const isVip = u.type === "vip";
        const row = document.createElement("div");
        row.className = "user-row" + (isVip ? " vip" : "");

        const avatar = document.createElement("div");
        avatar.className = "user-avatar";
        avatar.textContent = (u.name || "?").trim().charAt(0).toUpperCase() || "?";

        const info = document.createElement("div");
        info.className = "user-info";
        const nameEl = document.createElement("b");
        nameEl.textContent = u.name;
        const metaEl = document.createElement("span");
        metaEl.textContent = "ID: " + u.numericId + " · " + u.username;
        const typeBadge = document.createElement("span");
        typeBadge.className = "user-type-badge" + (isVip ? " vip" : "");
        typeBadge.textContent = isVip ? "VIP" : "Normal";
        info.appendChild(nameEl);
        info.appendChild(metaEl);
        info.appendChild(typeBadge);

        const delBtn = document.createElement("button");
        delBtn.className = "user-del-btn";
        delBtn.type = "button";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", ()=>handleDeleteUser(u.id, u.numericId, u.username));

        row.appendChild(avatar);
        row.appendChild(info);
        row.appendChild(delBtn);
        usersList.appendChild(row);
    });
}
async function refreshUsersList(){
    try{
        const data = await apiFetch("/api/users", {
            headers: { "X-Admin-Password": adminSessionPassword }
        });
        renderUsersListFromData(data.users);
    }catch(err){
        usersList.innerHTML = '<div class="admin-empty">Could not load users.</div>';
    }
}
async function handleAddUser(){
    const name = newUserName.value.trim();
    const numericId = newUserNumericId.value.trim();
    const username = newUserUsername.value.trim();
    const password = newUserPassword.value;
    const type = newUserType.value === "vip" ? "vip" : "normal";

    addUserError.textContent = "";

    if (!name || !numericId || !username || !password){
        addUserError.textContent = "All fields are required.";
        return;
    }
    if (!/^\d+$/.test(numericId)){
        addUserError.textContent = "Numeric ID must contain digits only.";
        return;
    }

    addUserBtn.disabled = true;
    try{
        await apiFetch("/api/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Admin-Password": adminSessionPassword
            },
            body: JSON.stringify({ name, numericId, username, password, type })
        });
        newUserName.value = "";
        newUserNumericId.value = "";
        newUserUsername.value = "";
        newUserPassword.value = "";
        newUserType.value = "normal";
        await refreshUsersList();
    }catch(err){
        addUserError.textContent = err.message || "Could not add user.";
    }finally{
        addUserBtn.disabled = false;
    }
}
async function handleDeleteUser(id, numericId, username){
    try{
        await apiFetch("/api/users/" + encodeURIComponent(id), {
            method: "DELETE",
            headers: { "X-Admin-Password": adminSessionPassword }
        });
    }catch(err){
        // Fall through to refresh regardless, so the list reflects the
        // server's actual current state either way.
    }
    try{ localStorage.removeItem(CHAT_KEY_PREFIX + numericId); }catch(e){}
    const auth = loadAuth();
    if (auth && auth.numericId === numericId && auth.username === username){
        clearAuth();
    }
    await refreshUsersList();
    updateAccessUI();
}

/* ============================================================
   STORAGE (chat history per identity)
   ============================================================ */
function storageKey(identity){
    return CHAT_KEY_PREFIX + identity;
}
function saveState(){
    try{
        localStorage.setItem(storageKey(STATE.identity), JSON.stringify({
            conversation: STATE.conversation,
            count: STATE.count,
            firstTs: STATE.firstTs,
            lockUntil: STATE.lockUntil,
            version: STATE.version
        }));
    }catch(e){ /* storage failure: continue without persistence */ }
}
function loadState(identity){
    try{
        const raw = localStorage.getItem(storageKey(identity));
        if (raw){
            const parsed = JSON.parse(raw);
            STATE.conversation = parsed.conversation || [];
            STATE.count = parsed.count || 0;
            STATE.firstTs = parsed.firstTs || null;
            STATE.lockUntil = parsed.lockUntil || null;
        }
    }catch(e){ /* corrupted storage, start fresh */ }
}
function loadTheme(){
    const t = localStorage.getItem("necron_ai:theme");
    STATE.theme = (t === "light" || t === "dark") ? t : "dark";
}
function saveTheme(){
    localStorage.setItem("necron_ai:theme", STATE.theme);
}

/* ============================================================
   LIMIT SYSTEM
   ============================================================ */
function checkExpiry(){
    if (STATE.lockUntil && Date.now() >= STATE.lockUntil){
        // Exact 24h reset: wipe conversation and counters.
        STATE.conversation = [];
        STATE.count = 0;
        STATE.firstTs = null;
        STATE.lockUntil = null;
        saveState();
        return true;
    }
    return false;
}
function isLocked(){
    return !!(STATE.lockUntil && Date.now() < STATE.lockUntil);
}
function remaining(){
    return Math.max(0, currentLimitConfig().limit - STATE.count);
}
function registerUserMessage(){
    STATE.count += 1;
    const cfg = currentLimitConfig();
    if (STATE.count >= cfg.limit){
        const now = Date.now();
        STATE.firstTs = now;
        STATE.lockUntil = now + cfg.windowHours * 60 * 60 * 1000;
    }
    saveState();
}

/* ============================================================
   MARKDOWN RENDERER
   ============================================================ */
if (window.marked){
    marked.setOptions({ breaks: true, gfm: true });
}
function renderMarkdown(raw){
    let html;
    try{
        html = window.marked ? marked.parse(raw) : escapeHtml(raw);
    }catch(e){
        html = escapeHtml(raw);
    }
    if (window.DOMPurify){
        html = DOMPurify.sanitize(html, {
            FORBID_TAGS: ["script","iframe","object","embed","style"],
            FORBID_ATTR: ["onerror","onload","onclick","onmouseover","onfocus","onblur"]
        });
    }
    return html;
}
function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
}
function sanitizeUrlsInDom(container){
    container.querySelectorAll("a[href]").forEach(a=>{
        const href = a.getAttribute("href") || "";
        if (/^\s*javascript:/i.test(href)){
            a.removeAttribute("href");
        } else {
            a.setAttribute("target","_blank");
            a.setAttribute("rel","noopener noreferrer");
        }
    });
}

function isNearBottom(){
    const threshold = 80;

// Used for BOTH user and AI bubbles now, so markdown (bold, quotes, etc.)
// renders correctly instead of showing raw *asterisks* in sent messages.
function buildBubbleContent(container, text){
    container.innerHTML = renderMarkdown(text);
    sanitizeUrlsInDom(container);
    enhanceCodeBlocks(container);
}

function enhanceCodeBlocks(container){
    const pres = container.querySelectorAll("pre");
    pres.forEach(pre=>{
        if (pre.dataset.enhanced) return;
        pre.dataset.enhanced = "1";
        const codeEl = pre.querySelector("code");
        const rawCode = codeEl ? codeEl.textContent : pre.textContent;
        let lang = "";
        if (codeEl){
            const cls = (codeEl.className || "").match(/language-([\w+-]+)/);
            if (cls) lang = cls[1];
            // Apply real syntax highlighting/coloring, like an editor would.
            if (window.hljs){
                try{ hljs.highlightElement(codeEl); }catch(e){ /* ignore highlight failures */ }
            }
        }
        const wrap = document.createElement("div");
        wrap.className = "code-block";
        const head = document.createElement("div");
        head.className = "code-head";
        const langLabel = document.createElement("span");
        langLabel.textContent = lang || "code";
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.type = "button";
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", ()=>{
            copyText(rawCode).then(()=>{
                copyBtn.textContent = "Copied ✓";
                setTimeout(()=>{ copyBtn.textContent = "Copy"; }, 1500);
            }).catch(()=>{
                copyBtn.textContent = "Error";
                setTimeout(()=>{ copyBtn.textContent = "Copy"; }, 1500);
            });
        });
        head.appendChild(langLabel);
        head.appendChild(copyBtn);
        const parent = pre.parentNode;
        parent.insertBefore(wrap, pre);
        wrap.appendChild(head);
        wrap.appendChild(pre);
    });
}
function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject)=>{
        try{
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            resolve();
        }catch(e){ reject(e); }
    });
}

function appendUserMessage(text){
    const row = document.createElement("div");
    row.className = "msg-row user";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    buildBubbleContent(bubble, text);
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    updateWelcomeVisibility();
    return row;
}
function appendAiMessage(){
    const row = document.createElement("div");
    row.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";
    bubble.appendChild(typing);
    row.appendChild(bubble);
    chatScroll.appendChild(row);
    updateWelcomeVisibility();
    return { row, bubble };
}
function renderFullHistory(){
    chatScroll.querySelectorAll(".msg-row").forEach(el=>el.remove());
    STATE.conversation.forEach(m=>{
        if (m.role === "user"){
            appendUserMessage(m.content);
        } else {
            const { bubble } = appendAiMessage();
            buildBubbleContent(bubble, m.content);
        }
    });
    updateWelcomeVisibility();
    requestAnimationFrame(()=>scrollToBottom(false));
}

const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const composer = document.getElementById("composer");
const lockPanel = document.getElementById("lockPanel");
const lockCountdown = document.getElementById("lockCountdown");
const usageRow = document.getElementById("usageRow");

function autoResize(){
    msgInput.style.height = "auto";
    msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
}
msgInput.addEventListener("input", autoResize);
// Enter now always inserts a newline (default textarea behavior).
// Sending only happens via the Send button, as requested.
sendBtn.addEventListener("click", handleSend);

function updateUsageIndicator(){
    usageRow.textContent = STATE.count + " / " + currentLimitConfig().limit;
}

function setLockedUI(locked){
    if (locked){
        composer.style.display = "none";
        lockPanel.classList.add("show");
        msgInput.disabled = true;
        msgInput.blur();
        sendBtn.disabled = true;
        startCountdown();
    } else {
        composer.style.display = "flex";
        lockPanel.classList.remove("show");
        msgInput.disabled = false;
        sendBtn.disabled = false;
        stopCountdown();
    }
}
function startCountdown(){
    stopCountdown();
    tickCountdown();
    countdownTimer = setInterval(tickCountdown, 1000);
}
function stopCountdown(){
    if (countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
}
function tickCountdown(){
    if (checkExpiry()){
        finishReset();
        return;
    }
    const remainMs = Math.max(0, STATE.lockUntil - Date.now());
    const h = Math.floor(remainMs / 3600000);
    const m = Math.floor((remainMs % 3600000) / 60000);
    const s = Math.floor((remainMs % 60000) / 1000);
    lockCountdown.textContent =
        String(h).padStart(2,"0") + "h " +
        String(m).padStart(2,"0") + "m " +
        String(s).padStart(2,"0") + "s";
}
function finishReset(){
    stopCountdown();
    renderFullHistory();
    updateUsageIndicator();
    setLockedUI(false);
}

/* ============================================================
   ERROR MESSAGES
   ============================================================ */
const ERR = {
    empty: "Please write a message first.",
    noKey: "API key is not configured.",
    invalidKey: "API key is invalid.",
    network: "Could not connect to the AI service. Please try again.",
    rateLimit: "Too many requests right now. Try again in a bit.",
    modelUnavailable: "The AI model is temporarily unavailable.",
    malformed: "Received an invalid response.",
    backend: "Could not connect to the server.",
    generic: "Something went wrong. Please try again."
};

/* ============================================================
   AI API
   ============================================================ */
function buildMessagesForApi(){
    const MAX_HISTORY_MESSAGES = 20; // sensible cap to avoid unbounded context growth
    const history = STATE.conversation.slice(-MAX_HISTORY_MESSAGES);
    const messages = [{ role: "system", content: SYSTEM_PROMPT }];
    history.forEach(m=>{
        messages.push({ role: m.role, content: m.content });
    });
    return messages;
}

async function callGroqDirect(messages, onDelta){
    if (!CONFIG.GROQ_API_KEY){
        throw { userMessage: ERR.noKey };
    }
    let resp;
    try{
        resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + CONFIG.GROQ_API_KEY
            },
            body: JSON.stringify({
                model: CONFIG.MODEL,
                messages: messages,
                stream: true
            })
        });
    }catch(e){
        throw { userMessage: ERR.network };
    }

    if (!resp.ok){
        if (resp.status === 401 || resp.status === 403) throw { userMessage: ERR.invalidKey };
        if (resp.status === 429) throw { userMessage: ERR.rateLimit };
        if (resp.status === 404) throw { userMessage: ERR.modelUnavailable };
        throw { userMessage: ERR.generic };
    }

    if (!resp.body || !window.ReadableStream){
        // Fallback: no streaming support, parse full JSON.
        let data;
        try{ data = await resp.json(); }catch(e){ throw { userMessage: ERR.malformed }; }
        const content = data && data.choices && data.choices[0] && data.choices[0].message
            ? data.choices[0].message.content : "";
        if (!content) throw { userMessage: ERR.malformed };
        onDelta(content);
        return content;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    let full = "";
    try{
        while(true){
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines){
                const trimmed = line.trim();
                if (!trimmed.startsWith("data:")) continue;
                const payload = trimmed.slice(5).trim();
                if (payload === "[DONE]") continue;
                try{
                    const json = JSON.parse(payload);
                    const delta = json.choices && json.choices[0] && json.choices[0].delta
                        ? json.choices[0].delta.content : "";
                    if (delta){
                        full += delta;
                        onDelta(full);
                    }
                }catch(e){ /* skip malformed SSE chunk */ }
            }
        }
    }catch(e){
        if (!full) throw { userMessage: ERR.network };
    }
    if (!full) throw { userMessage: ERR.malformed };
    return full;
}

async function callBackend(messages, onDelta){
    if (!CONFIG.BACKEND_URL){
        throw { userMessage: ERR.backend };
    }
    let resp;
    try{
        resp = await fetch(CONFIG.BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                messages: messages,
                identity: STATE.identity,
                initData: (tg && tg.initData) ? tg.initData : null
            })
        });
    }catch(e){
        throw { userMessage: ERR.network };
    }
    if (!resp.ok){
        if (resp.status === 429) throw { userMessage: ERR.rateLimit };
        throw { userMessage: ERR.backend };
    }
    let data;
    try{ data = await resp.json(); }catch(e){ throw { userMessage: ERR.malformed }; }
    const content = data && data.content ? data.content : "";
    if (!content) throw { userMessage: ERR.malformed };
    onDelta(content);
    return content;
}

/* ============================================================
   SEND FLOW
   ============================================================ */
async function handleSend(){
    if (isSending) return; // prevent double-send / race conditions
    if (checkExpiry()){ finishReset(); }
    if (isLocked()){ setLockedUI(true); return; }

    const text = msgInput.value.trim();
    if (!text){
        flashError(ERR.empty);
        return;
    }
    if (remaining() <= 0){
        setLockedUI(true);
        return;
    }

    isSending = true;
    sendBtn.disabled = true;

    appendUserMessage(text);
    STATE.conversation.push({ role: "user", content: text });
    saveState();

    msgInput.value = "";
    autoResize();
    scrollToBottom(true);

    const { bubble } = appendAiMessage();
    scrollToBottom(true);

    const messages = buildMessagesForApi();
    let firstChunk = true;

    try{
        const finalText = await (CONFIG.DIRECT_GROQ_MODE
            ? callGroqDirect(messages, (partial)=>{
                if (firstChunk){ bubble.innerHTML = ""; firstChunk = false; }
                buildBubbleContent(bubble, partial);
                if (nearBottom) scrollToBottom(false);
            })
            : callBackend(messages, (partial)=>{
                bubble.innerHTML = "";
                buildBubbleContent(bubble, partial);
                if (nearBottom) scrollToBottom(false);
            })
        );
        STATE.conversation.push({ role: "assistant", content: finalText });
        // Only counted against the user's quota once the AI actually replied
        // successfully - so a failed/network-dropped request never costs
        // the user one of their messages.
        registerUserMessage();
        updateUsageIndicator();
        saveState();
        // Lock the composer immediately once the limit is hit, right after
        // this message - not on the next attempt.
        if (isLocked()){ setLockedUI(true); }
    }catch(err){
        const msg = (err && err.userMessage) ? err.userMessage : ERR.generic;
        bubble.innerHTML = "";
        const errSpan = document.createElement("span");
        errSpan.style.color = "var(--danger)";
        errSpan.textContent = msg;
        bubble.appendChild(errSpan);
    }finally{
        isSending = false;
        if (!isLocked()){
            sendBtn.disabled = false;
        }
        if (nearBottom) scrollToBottom(true);
    }
}

function flashError(msg){
    const { bubble } = appendAiMessage();
    bubble.innerHTML = "";
    const errSpan = document.createElement("span");
    errSpan.style.color = "var(--danger)";
    errSpan.textContent = msg;
    bubble.appendChild(errSpan);
    scrollToBottom(true);
}

const loginPassword = document.getElementById("loginPassword");
const loginError = document.getElementById("loginError");
const loginBtn = document.getElementById("loginBtn");

async function submitLogin(){
    const u = loginUsername.value.trim();
    const p = loginPassword.value;
    if (!u || !p){
        loginError.textContent = "Please enter both fields.";
        return;
    }
    loginError.textContent = "";
    loginBtn.disabled = true;
    try{
        await attemptLogin(u, p);
        loginUsername.value = "";
        loginPassword.value = "";
        updateAccessUI();
    }catch(err){
        loginError.textContent = (err.status === 401)
            ? "Invalid username or password."
            : "Could not reach the server. Please try again.";
    }finally{
        loginBtn.disabled = false;
    }
}
loginBtn.addEventListener("click", submitLogin);
[loginUsername, loginPassword].forEach(el=>{
    el.addEventListener("keydown", (e)=>{
        if (e.key === "Enter"){ e.preventDefault(); submitLogin(); }
    });
});
